<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background-color: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .game-frame {
            width: 1280px;
            height: 720px;
            border: 3px solid #444;
            border-radius: 8px;
            background: #000;
        }
        .player-info {
            background: #16213e;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px 24px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="player-info">
            Jugador: <strong id="player-name">...</strong>
        </div>

        <iframe
            id="game-frame"
            class="game-frame"
            src="../../Unity/index.html"
            allowfullscreen>
        </iframe>

        <small class="text-secondary">Usa las flechas o WASD para moverte.</small>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search)
        const id = params.get('id')

        if (!id) {
            window.location.href = '../index.html'
        }

        fetch(`http://localhost:5000/users/${id}`)
            .then(res => res.json())
            .then(user => {
                document.getElementById('player-name').textContent = user.name
            })
            .catch(() => {
                document.getElementById('player-name').textContent = 'Desconocido'
            })

        // Apunta al build de Unity WebGL — ajusta la ruta si cambia
        document.getElementById('game-frame').src = `/Unity/index.html?id=${id}`
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
